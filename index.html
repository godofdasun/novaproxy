<!DOCTYPE html>

<head>

<style>

/* =========================================================
   NOVA — GLOBAL
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #050508;
    color: white;

    min-height: 100vh;

    overflow-x: hidden;
}

/* =========================================================
   ANIMATED BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: 0;

    z-index: -10;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(103, 78, 255, .20),
            transparent 30%
        ),

        radial-gradient(
            circle at 85% 25%,
            rgba(0, 204, 255, .13),
            transparent 30%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(176, 64, 255, .15),
            transparent 35%
        ),

        #050508;
}

.background::before {
    content: "";

    position: absolute;

    width: 750px;
    height: 750px;

    left: -250px;
    top: -250px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(115, 85, 255, .18),
            transparent 68%
        );

    filter: blur(30px);

    animation:
        orbOne 18s ease-in-out infinite alternate;
}

.background::after {
    content: "";

    position: absolute;

    width: 650px;
    height: 650px;

    right: -250px;
    bottom: -200px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0, 190, 255, .12),
            transparent 68%
        );

    filter: blur(35px);

    animation:
        orbTwo 21s ease-in-out infinite alternate;
}

@keyframes orbOne {

    0% {
        transform:
            translate(0,0)
            scale(1);
    }

    50% {
        transform:
            translate(500px,350px)
            scale(1.35);
    }

    100% {
        transform:
            translate(900px,-100px)
            scale(.9);
    }
}

@keyframes orbTwo {

    0% {
        transform:
            translate(0,0)
            scale(1);
    }

    50% {
        transform:
            translate(-500px,-300px)
            scale(1.3);
    }

    100% {
        transform:
            translate(-200px,-600px)
            scale(.8);
    }
}

/* =========================================================
   STARS
========================================================= */

.stars {
    position: fixed;
    inset: 0;

    z-index: -9;

    pointer-events: none;

    opacity: .32;

    background-image:

        radial-gradient(
            circle,
            white 1px,
            transparent 1px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.7) 1px,
            transparent 1px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.4) 1px,
            transparent 1px
        );

    background-size:
        130px 130px,
        210px 210px,
        310px 310px;

    background-position:
        0 0,
        40px 80px,
        100px 20px;

    animation:
        starsMove 40s linear infinite;
}

@keyframes starsMove {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-350px);
    }
}

/* =========================================================
   NAVBAR
========================================================= */

.navbar {

    justify-content: space-between;

    padding:
        0 clamp(20px, 7vw, 100px);

}

.logo {

}

.logo span {

}

.status-dot {

/* =========================================================
   HERO
========================================================= */

/* =========================================================
   SEARCH
========================================================= */

.search-wrapper {

    width:
        min(620px, 90%);

    margin:
        0 auto 35px;

    position: relative;
}

.search-icon {

    position: absolute;

    left: 17px;

}

.search {

.search::placeholder {

}

.search:focus {

    border-color:
        rgba(143,124,255,.5);

}

/* =========================================================
   CATEGORY BAR
========================================================= */

.category-area {

    width:
        min(1200px, 94%);

    margin:
        0 auto 40px;
}

.categories {

    display: flex;

    gap: 8px;

    overflow-x: auto;

    padding:
        5px 2px 12px;

    scrollbar-width: thin;
}

.category {

    flex:

        1px solid rgba(255,255,255,.08);

    color:

    border-radius: 10px;

    padding:
        9px 14px;

    font-size: 12px;

    cursor: pointer;

    transition:
        .2s ease;
}

.category:hover {

    color: white;

    background:
        rgba(255,255,255,.07);
}

.category.active {

    color: white;

    background:
        rgba(135,115,255,.17);

        rgba(145,125,255,.45);

}

/* =========================================================
   GAME SECTION
========================================================= */

.games-section {

    width:

    margin:
        0 auto;

    padding-bottom: 100px;
}

.section-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;
}

.section-title {

    font-size: 20px;

    font-weight: 700;
}

.game-count {

    font-size: 12px;

    color:
        rgba(255,255,255,.32);
}

/* =========================================================
   GAME GRID
========================================================= */

.game-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(220px, 1fr)
        );

    gap: 16px;
}

/* =========================================================
   GAME CARD
========================================================= */

.game-card {

    position: relative;

    min-height: 210px;

    padding: 22px;

    border-radius: 18px;

    border:
        1px solid rgba(255,255,255,.08);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    overflow: hidden;

    transition:
        transform .28s ease,
        border .28s ease,
        box-shadow .28s ease;

    backdrop-filter:
        blur(14px);
}

.game-card::after {

    content: "";

    position: absolute;

    width: 170px;
    height: 170px;

    right: -80px;
    top: -80px;

    border-radius: 50%;

    background:

        .4s ease;
}

.game-card:hover {

}

.game-number {

.play-button {

        10px 16px;

/* =========================================================

footer {

/* =========================================================

========================================================= */

#gameViewer {

    z-index: 999999;

}

}

#gameFrame {

/* =========================================================

========================================================= */

.back-button {

    position: fixed;

    left: 15px;

    z-index: 1000000;

    border:
        1px solid rgba(255,255,255,.12);

    background:

        9px 13px;

}

.back-button:hover {

}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px) {

    .navbar {

        padding:
            0 20px;

        display: none;

    }

        grid-template-columns:
            repeat(
                auto-fill,
                minmax(170px,1fr)
            );
    }

    .game-card {

        min-height:
            195px;

        padding:
            18px;
    }
}

</style>

<script>

    },

    {
        name: "Crossy Road",
        category: "Comedy",
        description: "Cross the road without getting crushed.",
        url: "https://ubghyper.github.io/games/Crossy-Road.html"
    }

];


/* =========================================================
   CATEGORIES
========================================================= */

const categories = [

    "All",
    "Action",
    "Adventure",
    "Arcade",
    "Comedy",
    "Fighting",
    "Horror",
    "Idle",
    "Multiplayer",
    "Physics",
    "Platformer",
    "Puzzle",
    "Racing",
    "Retro",
    "Rhythm",
    "RPG",
    "Sandbox",
    "Shooter",
    "Simulation",
    "Sports",
    "Strategy"

];


/* =========================================================
   ELEMENTS
========================================================= */

const categoryContainer =
    document.getElementById("categories");

const gameGrid =
    document.getElementById("gameGrid");

const gameCount =
    document.getElementById("gameCount");

const sectionTitle =
    document.getElementById("sectionTitle");

const noResults =
    document.getElementById("noResults");

const search =
    document.getElementById("search");

const gameViewer =
    document.getElementById("gameViewer");

const gameFrame =
    document.getElementById("gameFrame");

const backButton =
    document.getElementById("backButton");


/* =========================================================
   CURRENT STATE
========================================================= */

let currentCategory = "All";

let searchMode = false;

let lastCategory = "All";


/* =========================================================
   BUILD CATEGORY BUTTONS
========================================================= */

categories.forEach(category => {

    const button =
        document.createElement("button");

    button.className =
        "category";

    button.textContent =
        category;

    if (category === "All") {

        button.classList.add("active");

    }

    button.onclick = () => {

        selectCategory(category);

    };

    categoryContainer.appendChild(button);

});


/* =========================================================
   SELECT CATEGORY
========================================================= */

function selectCategory(category) {

    currentCategory =
        category;

    searchMode =
        false;

    lastCategory =
        category;

    search.value =
        "";

    document
        .querySelectorAll(".category")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.textContent === category
            );

        });

    renderGames();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   RENDER GAMES
========================================================= */

function renderGames() {

    gameGrid.innerHTML = "";

    let visibleGames = [];


    /*
       SEARCH MODE

       Search always searches
       the complete NOVA library.
    */

    if (searchMode) {

        const query =
            search.value
                .toLowerCase()
                .trim();

        visibleGames =
            games.filter(game =>
                game.name
                    .toLowerCase()
                    .includes(query) ||

                game.category
                    .toLowerCase()
                    .includes(query)
            );

        sectionTitle.textContent =
            "Search Results";

    }

    /*
       NORMAL CATEGORY MODE
    */

    else {

        if (currentCategory === "All") {

            visibleGames =
                games;

            sectionTitle.textContent =
                "All Games";

        }

        else {

            visibleGames =
                games.filter(
                    game =>
                        game.category ===
                        currentCategory
                );

            sectionTitle.textContent =
                currentCategory;
        }

    }


    gameCount.textContent =
        visibleGames.length +
        " games";


    /*
       NO RESULTS
    */

    if (visibleGames.length === 0) {

        noResults.style.display =
            "block";

        return;

    }

    noResults.style.display =
        "none";


    /*
       CREATE CARDS
    */

    visibleGames.forEach(
        (game, index) => {

            const card =
                document.createElement("div");

            card.className =
                "game-card";


            card.innerHTML = `

                <div class="game-number">
                    ${String(index + 1).padStart(2,"0")}
                </div>

                <div class="game-category">
                    ${game.category}
                </div>

                <h3>
                    ${game.name}
                </h3>

                <p>
                    ${game.description}
                </p>

                <button
                    class="play-button"
                    onclick='launchGame(${JSON.stringify(game)})'
                >
                    Play →
                </button>

            `;


            gameGrid.appendChild(card);

        }
    );

}


/* =========================================================
   SEARCH
========================================================= */

search.addEventListener(
    "input",
    function() {

        /*
           Empty search = return to category.
        */

        if (
            this.value.trim() === ""
        ) {

            searchMode =
                false;

            renderGames();

            return;

        }


        /*
           Typing anything switches
           to global search.
        */

        searchMode =
            true;

        renderGames();

    }
);


/* =========================================================
   LAUNCH GAME
========================================================= */

async function launchGame(game) {

    /*
       Remember where the player came from.
    */

    lastCategory =
        currentCategory;


    /*
       Open viewer.
    */

    gameViewer.classList.add(
        "active"
    );

    document.body.style.overflow =
        "hidden";


    /*
       Load game.
    */

    gameFrame.src =
        game.url;


    /*
       Attempt real browser fullscreen.
    */

    try {

        if (
            !document.fullscreenElement &&
            gameViewer.requestFullscreen
        ) {

            await gameViewer.requestFullscreen();

        }

    } catch(error) {

        console.log(
            "Fullscreen permission:",
            error
        );

    }

}


/* =========================================================
   RETURN TO NOVA
========================================================= */

function returnToNova() {

    /*
       Stop the game.
    */

    gameFrame.src =
        "";


    /*
       Close fullscreen if possible.
    */

    if (
        document.fullscreenElement
    ) {

        document.exitFullscreen()
            .catch(() => {});

    }


    /*
       Hide viewer.
    */

    gameViewer.classList.remove(
        "active"
    );

    document.body.style.overflow =
        "";


    /*
       Return to the category
       the player came from.
    */

    if (
        searchMode
    ) {

        searchMode =
            false;

        search.value =
            "";

    }


    selectCategory(
        lastCategory
    );

}


/* =========================================================
   BACK BUTTON
========================================================= */

backButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        returnToNova();

    }
);


/* =========================================================
   DETECT FULLSCREEN EXIT
=========================================================

   IMPORTANT:

   Browsers always allow ESC to exit
   fullscreen. We cannot disable that.

   Instead, when fullscreen ends,
   NOVA immediately comes back.
========================================================= */

document.addEventListener(
    "fullscreenchange",
    function() {

        if (
            gameViewer.classList.contains("active") &&
            !document.fullscreenElement
        ) {

            returnToNova();

        }

    }
);


/* =========================================================
   ESCAPE BACKUP
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" &&
            gameViewer.classList.contains("active")
        ) {

            /*
               Browser will exit fullscreen,
               triggering fullscreenchange.

               This backup handles browsers
               that behave differently.
            */

            setTimeout(
                () => {

                    if (
                        gameViewer.classList.contains(
                            "active"
                        )
                    ) {

                        returnToNova();

                    }

                },
                100
            );

        }

    }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

renderGames();

</script>
