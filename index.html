<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA.</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #050508;
    --card: rgba(255,255,255,.055);
    --border: rgba(255,255,255,.09);
    --muted: rgba(255,255,255,.42);
    --purple: #8d7cff;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background: var(--bg);
    color: white;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    overflow-x: hidden;
}

/* =====================================================
   BACKGROUND
===================================================== */

.background {
    position: fixed;
    inset: 0;
    z-index: -10;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(105,80,255,.22),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 20%,
            rgba(0,210,255,.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(180,70,255,.14),
            transparent 35%
        ),
        #050508;
}

.background::before {
    content: "";
    position: absolute;

    width: 700px;
    height: 700px;

    left: -300px;
    top: -300px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(110,85,255,.18),
            transparent 68%
        );

    filter: blur(30px);

    animation:
        orb1 18s ease-in-out infinite alternate;
}

.background::after {
    content: "";
    position: absolute;

    width: 650px;
    height: 650px;

    right: -250px;
    bottom: -250px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,190,255,.12),
            transparent 68%
        );

    filter: blur(35px);

    animation:
        orb2 20s ease-in-out infinite alternate;
}

@keyframes orb1 {
    0% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(500px,350px) scale(1.3);
    }

    100% {
        transform: translate(850px,-50px) scale(.9);
    }
}

@keyframes orb2 {
    0% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(-450px,-250px) scale(1.3);
    }

    100% {
        transform: translate(-150px,-600px) scale(.85);
    }
}

.stars {
    position: fixed;
    inset: 0;
    z-index: -9;

    pointer-events: none;

    opacity: .3;

    background-image:
        radial-gradient(circle, white 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.6) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.35) 1px, transparent 1px);

    background-size:
        130px 130px,
        210px 210px,
        310px 310px;

    background-position:
        0 0,
        40px 70px,
        100px 20px;

    animation: stars 40s linear infinite;
}

@keyframes stars {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-350px);
    }
}

/* =====================================================
   NAV
===================================================== */

.navbar {
    height: 72px;

    position: sticky;
    top: 0;
    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 clamp(20px,7vw,100px);

    background: rgba(5,5,8,.7);

    border-bottom:
        1px solid rgba(255,255,255,.07);

    backdrop-filter: blur(20px);
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -1px;
}

.logo span {
    color: var(--purple);
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;

    color: rgba(255,255,255,.4);

    font-size: 11px;
    letter-spacing: 1px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #71ffae;

    box-shadow:
        0 0 12px rgba(113,255,174,.8);
}

/* =====================================================
   HERO
===================================================== */

.hero {
    min-height: 400px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 70px 20px 50px;
}

.badge {
    padding: 8px 14px;

    border:
        1px solid rgba(255,255,255,.1);

    border-radius: 100px;

    background:
        rgba(255,255,255,.045);

    color:
        rgba(255,255,255,.65);

    font-size: 12px;

    margin-bottom: 25px;
}

.hero h1 {
    font-size:
        clamp(55px,10vw,100px);

    line-height: .86;

    letter-spacing: -7px;

    background:
        linear-gradient(
            110deg,
            #fff,
            #b8afff,
            #fff
        );

    background-size: 200% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation: shine 5s linear infinite;
}

@keyframes shine {
    to {
        background-position: 200% center;
    }
}

.hero p {
    max-width: 620px;

    margin-top: 25px;

    color: var(--muted);

    font-size: 14px;

    line-height: 1.7;
}

/* =====================================================
   SEARCH
===================================================== */

.search-wrap {
    width: min(650px,90%);

    margin: 0 auto 35px;

    position: relative;
}

.search-icon {
    position: absolute;

    left: 17px;
    top: 50%;

    transform: translateY(-50%);

    color:
        rgba(255,255,255,.35);

    pointer-events: none;
}

#search {
    width: 100%;
    height: 53px;

    padding:
        0 20px 0 45px;

    border-radius: 15px;

    border:
        1px solid rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.055);

    color: white;

    outline: none;

    font-size: 14px;

    backdrop-filter: blur(18px);

    transition: .25s;
}

#search::placeholder {
    color:
        rgba(255,255,255,.3);
}

#search:focus {
    border-color:
        rgba(141,124,255,.55);

    box-shadow:
        0 0 0 4px
        rgba(141,124,255,.07);
}

#search.disabled {
    opacity: .5;
}

/* =====================================================
   CATEGORIES
===================================================== */

.category-area {
    width: min(1250px,94%);

    margin:
        0 auto 35px;
}

.categories {
    display: flex;

    gap: 8px;

    overflow-x: auto;

    padding:
        4px 2px 12px;

    scrollbar-width: thin;
}

.category {
    flex: 0 0 auto;

    border:
        1px solid rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.035);

    color:
        rgba(255,255,255,.52);

    border-radius: 10px;

    padding:
        9px 14px;

    font-size: 12px;

    cursor: pointer;

    transition: .2s;
}

.category:hover {
    color: white;

    background:
        rgba(255,255,255,.07);
}

.category.active {
    color: white;

    background:
        rgba(141,124,255,.17);

    border-color:
        rgba(141,124,255,.45);
}

/* =====================================================
   GAME SECTION
===================================================== */

.games {
    width: min(1250px,94%);

    margin: 0 auto;

    padding-bottom: 100px;
}

.section-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;
}

.section-title {
    font-size: 20px;
    font-weight: 700;
}

.game-count {
    color:
        rgba(255,255,255,.3);

    font-size: 12px;
}

/* =====================================================
   GRID
===================================================== */

.game-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(220px,1fr)
        );

    gap: 16px;
}

/* =====================================================
   CARD
===================================================== */

.game-card {
    position: relative;

    min-height: 250px;

    overflow: hidden;

    border-radius: 18px;

    border:
        1px solid rgba(255,255,255,.08);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    transition:
        transform .28s ease,
        border-color .28s ease,
        box-shadow .28s ease;

    backdrop-filter: blur(14px);
}

.game-card:hover {
    transform: translateY(-6px);

    border-color:
        rgba(141,124,255,.4);

    box-shadow:
        0 20px 50px rgba(0,0,0,.35);
}

.game-image {
    width: 100%;
    height: 125px;

    object-fit: cover;

    display: block;

    background:
        linear-gradient(
            135deg,
            #11111a,
            #252038
        );

    opacity: .8;

    transition: .3s;
}

.game-card:hover .game-image {
    opacity: 1;

    transform: scale(1.03);
}

.game-info {
    padding: 16px;
}

.game-category {
    display: inline-block;

    padding:
        5px 8px;

    margin-bottom: 9px;

    border-radius: 7px;

    background:
        rgba(255,255,255,.055);

    color:
        rgba(255,255,255,.45);

    font-size: 9px;

    text-transform: uppercase;
}

.game-name {
    font-size: 17px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    margin-bottom: 6px;
}

.game-desc {
    color:
        rgba(255,255,255,.35);

    font-size: 11px;

    line-height: 1.45;

    height: 32px;

    overflow: hidden;

    margin-bottom: 13px;
}

.play {
    width: 100%;

    padding: 9px;

    border: none;

    border-radius: 9px;

    background: white;

    color: #07070a;

    font-weight: 800;

    font-size: 11px;

    cursor: pointer;

    transition: .2s;
}

.play:hover {
    transform: scale(1.02);
}

/* =====================================================
   LOADING
===================================================== */

.loading {
    padding: 100px 20px;

    text-align: center;

    color:
        rgba(255,255,255,.35);
}

.loader {
    width: 30px;
    height: 30px;

    margin:
        0 auto 15px;

    border:
        3px solid rgba(255,255,255,.1);

    border-top-color:
        var(--purple);

    border-radius: 50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =====================================================
   NO RESULTS
===================================================== */

.no-results {
    display: none;

    text-align: center;

    padding: 90px 20px;

    color:
        rgba(255,255,255,.35);
}

.no-results h2 {
    color:
        rgba(255,255,255,.7);

    margin-bottom: 8px;
}

/* =====================================================
   FOOTER
===================================================== */

footer {
    padding: 35px 20px;

    text-align: center;

    border-top:
        1px solid rgba(255,255,255,.06);

    color:
        rgba(255,255,255,.25);

    font-size: 11px;
}

/* =====================================================
   GAME VIEWER
===================================================== */

#gameViewer {
    position: fixed;

    inset: 0;

    z-index: 999999;

    width: 100vw;
    height: 100vh;

    display: none;

    background: #000;
}

#gameViewer.active {
    display: block;
}

#gameFrame {
    position: absolute;

    inset: 0;

/*
   Tiny emergency back button.

*/

#backButton {
    position: fixed;

    top: 14px;
    left: 14px;

    z-index: 1000000;

    padding: 8px 12px;

    border-radius: 9px;

    border:
        1px solid rgba(255,255,255,.12);

    background:
        rgba(8,8,12,.7);

    color: white;

    font-size: 11px;

    opacity: .15;

#backButton:hover {

/* =====================================================

@media(max-width:700px) {

    .navbar {

    }

    .status {

    .hero h1 {

    }

    .game-grid {
        grid-template-columns:
            repeat(
                auto-fill,
                minmax(165px,1fr)
            );
    }

    .game-card {
        min-height: 235px;
    }
}

</style>

            id="gameCount"

    >

        <div class="loading">

            <div class="loader"></div>

            Loading NOVA library...

        class="no-results"

<script>

/* =====================================================
   CONFIGURATION
===================================================== */

/*
   UBGHyper's live game database.

   NOVA reads this automatically, meaning you
   don't have to manually add hundreds of games.
*/

const GAME_DATABASE =
    "https://ubghyper.github.io/assets/games.json";


const GAME_BASE =
    "https://ubghyper.github.io/games/";


/*
   Your requested categories.
*/

const CATEGORIES = [

    "All",
    "Action",
    "Adventure",
    "Arcade",
    "Comedy",
    "Fighting",
    "Horror",
    "Idle",
    "Multiplayer",
    "Physics",
    "Platformer",
    "Puzzle",
    "Racing",
    "Retro",
    "Rhythm",
    "RPG",
    "Sandbox",
    "Shooter",
    "Simulation",
    "Sports",
    "Strategy"

];


/* =====================================================
   ELEMENTS
===================================================== */

const categoryBox =
    document.getElementById("categories");

const gameGrid =
    document.getElementById("gameGrid");

const gameCount =
    document.getElementById("gameCount");

const sectionTitle =
    document.getElementById("sectionTitle");

const search =
    document.getElementById("search");

const noResults =
    document.getElementById("noResults");

const viewer =
    document.getElementById("gameViewer");

const frame =
    document.getElementById("gameFrame");

const backButton =
    document.getElementById("backButton");


/* =====================================================
   STATE
===================================================== */

let allGames = [];

let currentCategory = "All";

let lastCategory = "All";

let searching = false;


/* =====================================================
   BUILD CATEGORIES
===================================================== */

CATEGORIES.forEach(category => {

    const button =
        document.createElement("button");

    button.className =
        "category";

    button.textContent =
        category;

    if (category === "All") {
        button.classList.add("active");
    }

    button.addEventListener(
        "click",
        () => {

            selectCategory(category);

        }
    );

    categoryBox.appendChild(button);

});


/* =====================================================
   LOAD COMPLETE UBGHYPER LIBRARY
===================================================== */

async function loadGames() {

    try {

        const response =
            await fetch(
                GAME_DATABASE,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {
            throw new Error(
                "Could not load game database."
            );
        }


        const data =
            await response.json();


        /*
           Keep EVERY entry.

           We intentionally do NOT remove
           "broken" or "buggy" entries because
           you asked for ALL of them.
        */

        allGames =
            data.filter(
                game =>
                    game &&
                    game.name &&
                    game.url
            );


        /*
           Sort alphabetically.
        */

        allGames.sort(
            (a,b) =>
                a.name.localeCompare(b.name)
        );


        renderGames();


    } catch(error) {

        console.error(error);

        gameGrid.innerHTML = `

            <div class="loading">

                <h2>
                    Couldn't load the game library.
                </h2>

                <p style="
                    margin-top:10px;
                    color:rgba(255,255,255,.3);
                ">
                    Check your internet connection
                    and try refreshing NOVA.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   CATEGORY SELECTION
===================================================== */

function selectCategory(category) {

    currentCategory =
        category;

    lastCategory =
        category;

    searching =
        false;

    search.value =
        "";


    /*
       Enable search only on All.
    */

    if (category === "All") {

        search.disabled =
            false;

        search.classList.remove(
            "disabled"
        );

        search.placeholder =
            "Search all games...";

    } else {

        search.disabled =
            true;

        search.classList.add(
            "disabled"
        );

        search.placeholder =
            "Search is available in All";

    }


    document
        .querySelectorAll(".category")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.textContent === category
            );

        });


    renderGames();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   RENDER GAMES
===================================================== */

function renderGames() {

    gameGrid.innerHTML = "";

    let gamesToShow = [];


    /* ================================================
       GLOBAL SEARCH
    ================================================ */

    if (
        currentCategory === "All" &&
        searching
    ) {

        const query =
            search.value
                .trim()
                .toLowerCase();


        gamesToShow =
            allGames.filter(game => {

                const name =
                    String(game.name || "")
                        .toLowerCase();

                const description =
                    String(game.gamedesc || "")
                        .toLowerCase();

                const tags =
                    Array.isArray(game.tags)
                        ? game.tags.join(" ")
                            .toLowerCase()
                        : "";

                return (
                    name.includes(query) ||
                    description.includes(query) ||
                    tags.includes(query)
                );

            });


        sectionTitle.textContent =
            "Search Results";

    }


    /* ================================================
       NORMAL CATEGORY
    ================================================ */

    else {

        if (
            currentCategory === "All"
        ) {

            gamesToShow =
                allGames;

            sectionTitle.textContent =
                "All Games";

        } else {

            gamesToShow =
                allGames.filter(game => {

                    if (
                        !Array.isArray(game.tags)
                    ) {
                        return false;
                    }

                    return game.tags.some(
                        tag =>
                            String(tag)
                                .toLowerCase() ===
                            currentCategory
                                .toLowerCase()
                    );

                });


            sectionTitle.textContent =
                currentCategory;

        }

    }


    gameCount.textContent =
        gamesToShow.length +
        " games";


    /* ================================================
       NO RESULTS
    ================================================ */

    if (
        gamesToShow.length === 0
    ) {

        noResults.style.display =
            "block";

        return;

    }


    noResults.style.display =
        "none";


    /* ================================================
       CREATE CARDS
    ================================================ */

    const fragment =
        document.createDocumentFragment();


    gamesToShow.forEach(game => {

        const card =
            document.createElement("div");

        card.className =
            "game-card";


        /*
           UBGHyper stores the image filename
           separately from the game URL.
        */

        let imageURL = "";

        if (game.image) {

            imageURL =
                "https://ubghyper.github.io/assets/" +
                encodeURIComponent(game.image);

        }


        const firstCategory =
            Array.isArray(game.tags) &&
            game.tags.length
                ? game.tags[0]
                : "Game";


        const description =
            game.gamedesc ||
            "Play this game in your browser.";


        card.innerHTML = `

            ${
                imageURL
                ? `
                    <img
                        class="game-image"
                        src="${imageURL}"
                        alt=""
                        loading="lazy"
                        onerror="
                            this.style.display='none'
                        "
                    >
                  `
                : `
                    <div
                        class="game-image"
                    ></div>
                  `
            }

            <div class="game-info">

                <div class="game-category">
                    ${escapeHTML(firstCategory)}
                </div>

                <div class="game-name">
                    ${escapeHTML(game.name)}
                </div>

                <div class="game-desc">
                    ${escapeHTML(description)}
                </div>

                <button
                    class="play"
                >
                    Play →
                </button>

            </div>

        `;


        card
            .querySelector(".play")
            .addEventListener(
                "click",
                () => launchGame(game)
            );


        fragment.appendChild(card);

    });


    gameGrid.appendChild(fragment);

}


/* =====================================================
   SEARCH
===================================================== */

search.addEventListener(
    "input",
    () => {

        /*
           Search only works in All.
        */

        if (
            currentCategory !== "All"
        ) {

            return;

        }


        const value =
            search.value.trim();


        /*
           Don't show "Search Results"
           until the user actually types.
        */

        searching =
            value.length > 0;


        renderGames();

    }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   LAUNCH GAME
===================================================== */

async function launchGame(game) {

    /*
       Remember category.

       If the user launched from All,
       they return to All.

       If they launched from Racing,
       they return to Racing.
    */

    lastCategory =
        currentCategory;


    /*
       Construct direct UBGHyper game URL.
    */

    const gameURL =
        GAME_BASE +
        encodeURIComponent(game.url) +
        ".html";


    /*
       Show viewer.
    */

    viewer.classList.add(
        "active"
    );

    document.body.style.overflow =
        "hidden";


    /*
       Load game page.
    */

    frame.src =
        gameURL;


    /*
       Automatically request browser
       fullscreen.

       This works because launchGame()
       is called directly by the user's
       click.
    */

    try {

        if (
            !document.fullscreenElement
        ) {

            await viewer.requestFullscreen();

        }

    } catch(error) {

        console.warn(
            "Fullscreen request was denied:",
            error
        );

    }

}


/* =====================================================
   RETURN TO NOVA
===================================================== */

function returnToNova() {

    /*
       Stop the game.
    */

    frame.src =
        "";


    /*
       Exit fullscreen if we're still
       in it.
    */

    if (
        document.fullscreenElement
    ) {

        document
            .exitFullscreen()
            .catch(() => {});

    }


    /*
       Hide viewer.
    */

    viewer.classList.remove(
        "active"
    );

    document.body.style.overflow =
        "";


    /*
       Return to the category
       the player came from.
    */

    selectCategory(
        lastCategory
    );

}


/* =====================================================
   FULLSCREEN CHANGE DETECTOR
=====================================================

   This is what makes:

       GAME
         ↓
       ESC
         ↓
       NOVA

   happen automatically.
===================================================== */

document.addEventListener(
    "fullscreenchange",
    () => {

        /*
           If the viewer was open but
           fullscreen has ended, return
           to NOVA.
        */

        if (
            viewer.classList.contains(
                "active"
            ) &&
            !document.fullscreenElement
        ) {

            returnToNova();

        }

    }
);


/* =====================================================
   BACK BUTTON
===================================================== */

backButton.addEventListener(
    "click",
    () => {

        returnToNova();

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

loadGames();

</script>
