<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA.</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;

    color: #ffffff;

    background: #050508;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   VARIABLES
========================================================= */

:root {

    --background: #050508;

    --panel:
        rgba(255,255,255,.055);

    --panel-hover:
        rgba(255,255,255,.085);

    --border:
        rgba(255,255,255,.09);

    --purple:
        #8d7cff;

    --purple-light:
        #b5aaff;

    --text-muted:
        rgba(255,255,255,.45);

    --text-dim:
        rgba(255,255,255,.28);

}


/* =========================================================
   ANIMATED BACKGROUND
========================================================= */

.background {

    position: fixed;

    inset: 0;

    z-index: -20;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(113,82,255,.22),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 15%,
            rgba(0,190,255,.13),
            transparent 30%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(170,65,255,.13),
            transparent 35%
        ),

        #050508;
}


.background::before {

    content: "";

    position: absolute;

    width: 800px;
    height: 800px;

    left: -350px;
    top: -350px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(110,85,255,.18),
            transparent 70%
        );

    filter: blur(40px);

    animation:
        floatingOrb1 18s ease-in-out infinite alternate;
}


.background::after {

    content: "";

    position: absolute;

    width: 700px;
    height: 700px;

    right: -300px;
    bottom: -300px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,190,255,.13),
            transparent 70%
        );

    filter: blur(40px);

    animation:
        floatingOrb2 21s ease-in-out infinite alternate;
}


@keyframes floatingOrb1 {

    0% {
        transform:
            translate(0,0)
            scale(1);
    }

    50% {
        transform:
            translate(500px,300px)
            scale(1.25);
    }

    100% {
        transform:
            translate(850px,-50px)
            scale(.9);
    }

}


@keyframes floatingOrb2 {

    0% {
        transform:
            translate(0,0)
            scale(1);
    }

    50% {
        transform:
            translate(-400px,-250px)
            scale(1.25);
    }

    100% {
        transform:
            translate(-150px,-600px)
            scale(.85);
    }

}


/* =========================================================
   STAR FIELD
========================================================= */

.stars {

    position: fixed;

    inset: 0;

    z-index: -19;

    pointer-events: none;

    opacity: .28;

    background-image:

        radial-gradient(
            circle,
            #ffffff 1px,
            transparent 1px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.6) 1px,
            transparent 1px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.3) 1px,
            transparent 1px
        );

    background-size:
        130px 130px,
        210px 210px,
        310px 310px;

    background-position:
        0 0,
        40px 70px,
        100px 20px;

    animation:
        starsMove 45s linear infinite;
}


@keyframes starsMove {

    from {
        transform:
            translateY(0);
    }

    to {
        transform:
            translateY(-350px);
    }

}


/* =========================================================
   NAVBAR
========================================================= */

.navbar {

    height: 72px;

    position: sticky;

    top: 0;

    z-index: 1000;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 clamp(
            20px,
            7vw,
            100px
        );

    background:
        rgba(5,5,8,.68);

    border-bottom:
        1px solid rgba(255,255,255,.07);

    backdrop-filter:
        blur(24px);

    -webkit-backdrop-filter:
        blur(24px);
}


.logo {

    font-size: 23px;

    font-weight: 900;

    letter-spacing: -1.5px;
}


.logo span {

    color:
        var(--purple);

}


.status {

    display: flex;

    align-items: center;

    gap: 8px;

    color:
        rgba(255,255,255,.38);

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 1.5px;
}


.status-dot {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background:
        #71ffae;

    box-shadow:
        0 0 14px
        rgba(113,255,174,.8);

    animation:
        statusPulse 2s infinite;
}


@keyframes statusPulse {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: .45;
    }

}


/* =========================================================
   HERO
========================================================= */

.hero {

    min-height: 405px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        75px 20px 50px;
}


.badge {

    display: inline-flex;

    align-items: center;

    gap: 7px;

    padding:
        8px 15px;

    margin-bottom: 25px;

    border:
        1px solid rgba(255,255,255,.1);

    border-radius: 100px;

    background:
        rgba(255,255,255,.045);

    color:
        rgba(255,255,255,.62);

    font-size: 11px;

    font-weight: 700;

    letter-spacing: .5px;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.15);
}


.hero h1 {

    font-size:
        clamp(
            58px,
            10vw,
            105px
        );

    line-height: .84;

    letter-spacing: -8px;

    font-weight: 900;

    background:

        linear-gradient(
            110deg,
            #ffffff 10%,
            #aaa0ff 48%,
            #ffffff 90%
        );

    background-size:
        220% auto;

    -webkit-background-clip:
        text;

    background-clip:
        text;

    color:
        transparent;

    animation:
        titleShine 6s linear infinite;

    text-shadow:
        0 20px 80px
        rgba(120,100,255,.12);
}


@keyframes titleShine {

    to {
        background-position:
            220% center;
    }

}


.hero p {

    margin-top: 28px;

    color:
        rgba(255,255,255,.52);

    font-size: 14px;

    letter-spacing: .8px;
}


/* =========================================================
   SEARCH
========================================================= */

.search-wrap {

    position: relative;

    width:
        min(
            680px,
            90%
        );

    margin:
        0 auto 38px;
}


.search-icon {

    position: absolute;

    left: 18px;

    top: 50%;

    transform:
        translateY(-50%);

    color:
        rgba(255,255,255,.32);

    font-size: 20px;

    pointer-events: none;
}


#search {

    width: 100%;

    height: 56px;

    padding:
        0 22px 0 49px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 16px;

    outline: none;

    color: white;

    background:
        rgba(255,255,255,.055);

    font-size: 14px;

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.12);

    transition:
        .25s ease;
}


#search::placeholder {

    color:
        rgba(255,255,255,.28);

}


#search:focus {

    border-color:
        rgba(141,124,255,.55);

    background:
        rgba(255,255,255,.07);

    box-shadow:
        0 0 0 4px
        rgba(141,124,255,.07),

        0 20px 60px
        rgba(0,0,0,.2);
}


#search.disabled {

    opacity: .45;

    cursor: not-allowed;
}


/* =========================================================
   CATEGORY BAR
========================================================= */

.category-area {

    width:
        min(
            1300px,
            94%
        );

    margin:
        0 auto 35px;
}


.categories {

    display: flex;

    gap: 8px;

    overflow-x: auto;

    padding:
        3px 2px 12px;

    scrollbar-width: thin;

    scrollbar-color:
        rgba(255,255,255,.12)
        transparent;
}


.category {

    flex:
        0 0 auto;

    padding:
        10px 15px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 11px;

    background:
        rgba(255,255,255,.035);

    color:
        rgba(255,255,255,.48);

    font-size: 11px;

    font-weight: 700;

    cursor: pointer;

    transition:
        .2s ease;
}


.category:hover {

    color: white;

    background:
        rgba(255,255,255,.075);

    border-color:
        rgba(255,255,255,.14);

    transform:
        translateY(-1px);
}


.category.active {

    color: white;

    background:
        linear-gradient(
            135deg,
            rgba(141,124,255,.24),
            rgba(141,124,255,.08)
        );

    border-color:
        rgba(141,124,255,.45);

    box-shadow:
        0 8px 25px
        rgba(100,80,255,.08);
}


/* =========================================================
   GAME SECTION
========================================================= */

.games {

    width:
        min(
            1300px,
            94%
        );

    margin:
        0 auto;

    padding-bottom:
        100px;
}


.section-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 20px;
}


.section-title {

    font-size: 21px;

    font-weight: 800;

    letter-spacing: -.5px;
}


.game-count {

    color:
        rgba(255,255,255,.27);

    font-size: 11px;

    font-weight: 600;
}


/* =========================================================
   GAME GRID
========================================================= */

.game-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(
                220px,
                1fr
            )
        );

    gap: 18px;
}


/* =========================================================
   GAME CARD
========================================================= */

.game-card {

    position: relative;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.075);

    border-radius: 19px;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.18);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    transform:
        translateY(0);

    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}


.game-card::before {

    content: "";

    position: absolute;

    inset: 0;

    z-index: 3;

    pointer-events: none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.08),
            transparent 35%
        );

    opacity: .45;
}


.game-card:hover {

    transform:
        translateY(-8px);

    border-color:
        rgba(141,124,255,.42);

    box-shadow:

        0 25px 60px
        rgba(0,0,0,.35),

        0 0 35px
        rgba(100,80,255,.07);
}


/* =========================================================
   THUMBNAIL
========================================================= */

.thumbnail {

    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    overflow: hidden;

    background:

        linear-gradient(
            135deg,
            #11111b,
            #211c3b
        );
}


.thumbnail img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

    opacity: .86;

    transition:
        transform .45s ease,
        opacity .35s ease;
}


.game-card:hover
.thumbnail img {

    transform:
        scale(1.08);

    opacity: 1;
}


/* Thumbnail gradient */

.thumbnail::after {

    content: "";

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            to bottom,
            transparent 35%,
            rgba(0,0,0,.55)
        );

    pointer-events: none;
}


/* Image loading fallback */

.thumbnail-fallback {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 42px;

    font-weight: 900;

    color:
        rgba(255,255,255,.12);

    background:

        radial-gradient(
            circle at 30% 30%,
            rgba(141,124,255,.25),
            transparent 50%
        ),

        linear-gradient(
            135deg,
            #11111b,
            #211c3b
        );
}


/* =========================================================
   GAME INFO
========================================================= */

.game-info {

    position: relative;

    padding:
        15px 16px 16px;
}


.game-category {

    display: inline-flex;

    padding:
        5px 8px;

    margin-bottom:
        9px;

    border-radius:
        7px;

    background:
        rgba(255,255,255,.055);

    color:
        rgba(255,255,255,.42);

    font-size: 8px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: .8px;
}


.game-name {

    font-size: 16px;

    line-height: 1.2;

    font-weight: 800;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    margin-bottom:
        6px;
}


.game-desc {

    height: 31px;

    overflow: hidden;

    color:
        rgba(255,255,255,.32);

    font-size: 10px;

    line-height: 1.5;

    margin-bottom:
        13px;
}


.play {

    width: 100%;

    padding:
        10px;

    border: none;

    border-radius: 10px;

    background:
        #ffffff;

    color:
        #07070a;

    font-size: 11px;

    font-weight: 900;

    cursor: pointer;

    transition:
        .2s ease;
}


.play:hover {

    transform:
        scale(1.025);

    box-shadow:
        0 8px 25px
        rgba(255,255,255,.12);
}


.play:active {

    transform:
        scale(.98);
}


/* =========================================================
   LOADING
========================================================= */

.loading {

    grid-column:
        1 / -1;

    padding:
        100px 20px;

    text-align:
        center;

    color:
        rgba(255,255,255,.35);
}


.loader {

    width: 34px;

    height: 34px;

    margin:
        0 auto 17px;

    border:
        3px solid
        rgba(255,255,255,.08);

    border-top-color:
        var(--purple);

    border-radius: 50%;

    animation:
        spin .8s linear infinite;
}


@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }

}


/* =========================================================
   NO RESULTS
========================================================= */

.no-results {

    display: none;

    text-align:
        center;

    padding:
        90px 20px;

    color:
        rgba(255,255,255,.3);
}


.no-results h2 {

    margin-bottom:
        8px;

    color:
        rgba(255,255,255,.72);
}


/* =========================================================
   FOOTER
========================================================= */

footer {

    padding:
        38px 20px;

    text-align:
        center;

    border-top:
        1px solid
        rgba(255,255,255,.06);

    color:
        rgba(255,255,255,.23);

    font-size:
        10px;

    letter-spacing:
        .3px;
}


/* =========================================================
   FULLSCREEN GAME VIEWER
========================================================= */

#gameViewer {

    position: fixed;

    inset: 0;

    z-index: 999999;

    width: 100vw;

    height: 100vh;

    display: none;

    background:
        #000;
}


#gameViewer.active {

    display: block;
}


#gameFrame {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    border: none;

    background:
        #000;
}


/* =========================================================
   BACK BUTTON
========================================================= */

#backButton {

    position: fixed;

    top: 14px;

    left: 14px;

    z-index: 1000000;

    padding:
        8px 12px;

    border:
        1px solid
        rgba(255,255,255,.13);

    border-radius:
        9px;

    background:
        rgba(8,8,12,.72);

    color:
        white;

    font-size:
        11px;

    font-weight:
        700;

    cursor:
        pointer;

    opacity:
        .12;

    backdrop-filter:
        blur(14px);

    transition:
        .2s ease;
}


#backButton:hover {

    opacity:
        1;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 700px) {

    .navbar {

        padding:
            0 20px;

    }


    .status {

        display:
            none;

    }


    .hero {

        min-height:
            350px;

    }


    .hero h1 {

        letter-spacing:
            -5px;

    }


    .game-grid {

        grid-template-columns:
            repeat(
                2,
                minmax(
                    0,
                    1fr
                )
            );

        gap:
            12px;

    }


    .game-card {

        border-radius:
            15px;

    }


    .game-info {

        padding:
            12px;

    }


    .game-name {

        font-size:
            14px;

    }


    .game-desc {

        font-size:
            9px;

    }


    .play {

        padding:
            9px;

    }

}


@media(max-width: 430px) {

    .game-grid {

        grid-template-columns:
            1fr 1fr;

    }

}

</style>
</head>


<body>


<!-- =========================================================
     BACKGROUND
========================================================= -->

<div class="background"></div>

<div class="stars"></div>


<!-- =========================================================
     NAVIGATION
========================================================= -->

<nav class="navbar">

    <div class="logo">
        NOVA<span>.</span>
    </div>

    <div class="status">

        <span class="status-dot"></span>

        ONLINE

    </div>

</nav>


<!-- =========================================================
     HERO
========================================================= -->

<section class="hero">

    <div class="badge">

        ✦ NOVA GAME HUB

    </div>


    <h1>

        PLAY.<br>
        UNLIMITED.

    </h1>


    <p>

        Powered by UBGHyper

    </p>

</section>


<!-- =========================================================
     SEARCH
========================================================= -->

<div class="search-wrap">

    <div class="search-icon">

        ⌕

    </div>


    <input

        id="search"

        type="text"

        placeholder="Search all games..."

        autocomplete="off"

    >

</div>


<!-- =========================================================
     CATEGORIES
========================================================= -->

<div class="category-area">

    <div

        class="categories"

        id="categories"

    ></div>

</div>


<!-- =========================================================
     GAME AREA
========================================================= -->

<section class="games">


    <div class="section-header">


        <div

            class="section-title"

            id="sectionTitle"

        >

            All Games

        </div>


        <div

            class="game-count"

            id="gameCount"

        ></div>


    </div>


    <div

        class="game-grid"

        id="gameGrid"

    >

        <div class="loading">

            <div class="loader"></div>

            Loading NOVA library...

        </div>

    </div>


    <div

        class="no-results"

        id="noResults"

    >

        <h2>

            No games found

        </h2>


        <p>

            Try another search.

        </p>

    </div>


</section>


<!-- =========================================================
     FOOTER
========================================================= -->

<footer>

    NOVA © 2026 · Powered by UBGHyper

</footer>


<!-- =========================================================
     GAME VIEWER
========================================================= -->

<div id="gameViewer">


    <button id="backButton">

        ← Back to NOVA

    </button>


    <iframe

        id="gameFrame"

        allow="fullscreen"

        allowfullscreen

    ></iframe>


</div>


<script>

/* =========================================================
   GAME DATABASE
========================================================= */

const GAME_DATABASE =
    "https://ubghyper.github.io/assets/games.json";


const GAME_BASE =
    "https://ubghyper.github.io/games/";


/* =========================================================
   CATEGORIES
========================================================= */

const CATEGORIES = [

    "All",
    "Action",
    "Adventure",
    "Arcade",
    "Comedy",
    "Fighting",
    "Horror",
    "Idle",
    "Multiplayer",
    "Physics",
    "Platformer",
    "Puzzle",
    "Racing",
    "Retro",
    "Rhythm",
    "RPG",
    "Sandbox",
    "Shooter",
    "Simulation",
    "Sports",
    "Strategy"

];


/* =========================================================
   ELEMENTS
========================================================= */

const categoryBox =
    document.getElementById(
        "categories"
    );


const gameGrid =
    document.getElementById(
        "gameGrid"
    );


const gameCount =
    document.getElementById(
        "gameCount"
    );


const sectionTitle =
    document.getElementById(
        "sectionTitle"
    );


const search =
    document.getElementById(
        "search"
    );


const noResults =
    document.getElementById(
        "noResults"
    );


const viewer =
    document.getElementById(
        "gameViewer"
    );


const frame =
    document.getElementById(
        "gameFrame"
    );


const backButton =
    document.getElementById(
        "backButton"
    );


/* =========================================================
   STATE
========================================================= */

let allGames = [];

let currentCategory = "All";

let lastCategory = "All";

let searching = false;


/* =========================================================
   CATEGORY BUTTONS
========================================================= */

CATEGORIES.forEach(category => {


    const button =
        document.createElement(
            "button"
        );


    button.className =
        "category";


    button.textContent =
        category;


    if (category === "All") {

        button.classList.add(
            "active"
        );

    }


    button.addEventListener(
        "click",
        () => {

            selectCategory(
                category
            );

        }
    );


    categoryBox.appendChild(
        button
    );

});


/* =========================================================
   LOAD GAME LIBRARY
========================================================= */

async function loadGames() {

    try {


        const response =
            await fetch(
                GAME_DATABASE,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Could not load game database."
            );

        }


        const data =
            await response.json();


        allGames =
            data.filter(
                game =>

                    game &&
                    game.name &&
                    game.url

            );


        allGames.sort(
            (a,b) =>

                a.name.localeCompare(
                    b.name
                )

        );


        renderGames();


    } catch(error) {


        console.error(error);


        gameGrid.innerHTML = `

            <div class="loading">

                <h2>
                    Couldn't load the game library.
                </h2>

                <p style="
                    margin-top:10px;
                    color:rgba(255,255,255,.3);
                ">

                    Check your connection
                    and refresh NOVA.

                </p>

            </div>

        `;

    }

}


/* =========================================================
   SELECT CATEGORY
========================================================= */

function selectCategory(category) {


    currentCategory =
        category;


    lastCategory =
        category;


    searching =
        false;


    search.value =
        "";


    search.disabled =
        category !== "All";


    search.classList.toggle(
        "disabled",
        category !== "All"
    );


    search.placeholder =

        category === "All"

            ? "Search all games..."

            : "Search is available in All";


    document
        .querySelectorAll(
            ".category"
        )
        .forEach(button => {


            button.classList.toggle(

                "active",

                button.textContent ===
                category

            );

        });


    renderGames();


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =========================================================
   CREATE THUMBNAIL
========================================================= */

function createThumbnail(game) {


    const thumbnail =
        document.createElement(
            "div"
        );


    thumbnail.className =
        "thumbnail";


    const fallback =
        document.createElement(
            "div"
        );


    fallback.className =
        "thumbnail-fallback";


    fallback.textContent =
        "N";


    thumbnail.appendChild(
        fallback
    );


    if (game.image) {


        const image =
            document.createElement(
                "img"
            );


        /*
           UBGHyper image paths are normally
           stored relative to /assets/.
        */

        let imageURL =
            String(
                game.image
            );


        if (
            !imageURL.startsWith(
                "http"
            )
        ) {


            imageURL =

                "https://ubghyper.github.io/assets/" +

                imageURL.replace(
                    /^\/+/,
                    ""
                );

        }


        image.src =
            imageURL;


        image.alt =
            game.name || "Game";


        image.loading =
            "lazy";


        image.onload = () => {

            fallback.style.display =
                "none";

        };


        image.onerror = () => {

            image.remove();

        };


        thumbnail.appendChild(
            image
        );

    }


    return thumbnail;

}


/* =========================================================
   RENDER GAMES
========================================================= */

function renderGames() {


    gameGrid.innerHTML =
        "";


    let gamesToShow =
        [];


    /* SEARCH */

    if (

        currentCategory === "All" &&

        searching

    ) {


        const query =
            search.value
                .trim()
                .toLowerCase();


        gamesToShow =
            allGames.filter(
                game => {


                    const name =

                        String(
                            game.name || ""
                        ).toLowerCase();


                    const description =

                        String(
                            game.gamedesc || ""
                        ).toLowerCase();


                    const tags =

                        Array.isArray(
                            game.tags
                        )

                            ?

                            game.tags
                                .join(" ")
                                .toLowerCase()

                            :

                            "";


                    return (

                        name.includes(
                            query
                        )

                        ||

                        description.includes(
                            query
                        )

                        ||

                        tags.includes(
                            query
                        )

                    );

                }
            );


        sectionTitle.textContent =
            "Search Results";

    }


    /* CATEGORY */

    else {


        if (
            currentCategory ===
            "All"
        ) {


            gamesToShow =
                allGames;


            sectionTitle.textContent =
                "All Games";

        }


        else {


            gamesToShow =

                allGames.filter(
                    game => {


                        if (
                            !Array.isArray(
                                game.tags
                            )
                        ) {

                            return false;

                        }


                        return game.tags.some(

                            tag =>

                                String(tag)
                                    .toLowerCase() ===

                                currentCategory
                                    .toLowerCase()

                        );

                    }
                );


            sectionTitle.textContent =
                currentCategory;

        }

    }


    gameCount.textContent =

        gamesToShow.length +
        " games";


    /* NO RESULTS */

    if (
        gamesToShow.length === 0
    ) {


        noResults.style.display =
            "block";


        return;

    }


    noResults.style.display =
        "none";


    /* CREATE CARDS */

    gamesToShow.forEach(
        game => {


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "game-card";


            /* THUMBNAIL */

            card.appendChild(
                createThumbnail(
                    game
                )
            );


            /* INFO */

            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "game-info";


            const category =
                Array.isArray(
                    game.tags
                )

                    &&

                game.tags.length

                    ?

                game.tags[0]

                    :

                "Game";


            const categoryElement =
                document.createElement(
                    "div"
                );


            categoryElement.className =
                "game-category";


            categoryElement.textContent =
                category;


            info.appendChild(
                categoryElement
            );


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "game-name";


            title.textContent =
                game.name;


            info.appendChild(
                title
            );


            const description =
                document.createElement(
                    "div"
                );


            description.className =
                "game-desc";


            description.textContent =

                game.gamedesc ||

                "Play this game in your browser.";


            info.appendChild(
                description
            );


            const play =
                document.createElement(
                    "button"
                );


            play.className =
                "play";


            play.textContent =
                "Play →";


            play.addEventListener(
                "click",
                () => {

                    launchGame(
                        game
                    );

                }
            );


            info.appendChild(
                play
            );


            card.appendChild(
                info
            );


            gameGrid.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   SEARCH
========================================================= */

search.addEventListener(
    "input",
    () => {


        if (
            currentCategory !==
            "All"
        ) {

            return;

        }


        searching =
            search.value
                .trim()
                .length > 0;


        renderGames();

    }
);


/* =========================================================
   LAUNCH GAME
========================================================= */

async function launchGame(game) {


    lastCategory =
        currentCategory;


    const gameURL =

        GAME_BASE +

        encodeURIComponent(
            game.url
        ) +

        ".html";


    viewer.classList.add(
        "active"
    );


    document.body.style.overflow =
        "hidden";


    frame.src =
        gameURL;


    /*
       The request happens directly from
       the user's button click, allowing
       the browser to approve fullscreen.
    */

    try {


        if (
            !document.fullscreenElement
        ) {


            await viewer.requestFullscreen();


        }


    } catch(error) {


        console.warn(
            "Fullscreen request denied:",
            error
        );

    }

}


/* =========================================================
   RETURN TO NOVA
========================================================= */

function returnToNova() {


    frame.src =
        "";


    if (
        document.fullscreenElement
    ) {


        document
            .exitFullscreen()
            .catch(
                () => {}
            );

    }


    viewer.classList.remove(
        "active"
    );


    document.body.style.overflow =
        "";


    selectCategory(
        lastCategory
    );

}


/* =========================================================
   BACK BUTTON
========================================================= */

backButton.addEventListener(
    "click",
    returnToNova
);


/* =========================================================
   FULLSCREEN DETECTION
========================================================= */

/*
   When the player presses ESC or otherwise
   leaves fullscreen, NOVA immediately
   returns them to the category they were
   browsing.
*/

document.addEventListener(
    "fullscreenchange",
    () => {


        if (

            viewer.classList.contains(
                "active"
            )

            &&

            !document.fullscreenElement

        ) {


            returnToNova();

        }

    }
);


/* =========================================================
   START NOVA
========================================================= */

loadGames();

</script>
